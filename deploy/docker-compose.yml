services:
  webhook:
    image: rafapasa/mcp-webhook:latest
    container_name: mcp-webhook
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
    networks:
      - mcp-network

  api:
    image: rafapasa/mcp-api:latest
    container_name: mcp-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge