services:
  mcp-server:
    image: ${DOCKER_REGISTRY:-ghcr.io/rafapasa/mcp-server-openerp}/mcp-server:${IMAGE_TAG:-latest}
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    networks:
      - mcp-network
    # DEPENDE REMOVIDO - mcp-mysql e mcp-redis já estão no ar em outro compose
    # depends_on:
    #   mcp-mysql:
    #     condition: service_healthy

networks:
  mcp-network:
    external: true
    name: mcp-network