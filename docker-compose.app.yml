services:
  mcp-server:
    image: ${DOCKER_USERNAME:-rafapasa}/mcp-server:${IMAGE_TAG:-latest}
    container_name: mcp-server
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    networks:
      - mcp-network

networks:
  mcp-network:
    external: true
    name: mcp-network