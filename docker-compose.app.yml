services:
  mcp-api:
    image: rafapasa/mcp-api:${IMAGE_TAG:-latest}
    container_name: mcp-api
    hostname: mcp-api
    restart: always
    env_file:
      - .env
    ports:
      - "8081:8081"
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp-webhook:
    image: rafapasa/mcp-webhook:${IMAGE_TAG:-latest}
    container_name: mcp-webhook
    hostname: mcp-webhook
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  mcp-network:
    external: true