name: MCP Server Diff

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  # REMOVIDO: push main - era isso que gerava email em todo commit

permissions:
  contents: read

jobs:
  mcp-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create mock.env for CI
        run: |
          cat >.env <<EOF
          DATABASE_URL=root:root@tcp(localhost:3306)/test?parseTime=true
          REDIS_URL=redis://localhost:6379
          WHATSAPP_VERIFY_TOKEN=test_token
          WHATSAPP_TOKEN=test
          GEMINI_API_KEY=test
          GROQ_API_KEY=test
          PORT=3000
          APP_ENV=test
          EOF
          cat.env

      - uses: SamMorrowDrums/mcp-server-diff@v3
        with:
          setup_go: true
          install_command: go mod download
          build_command: go build -o bin/stdio./cmd/stdio
          # só testa stdio, que não precisa subir HTTP server com DB/Redis
          configurations: |
            [
              {
                "name": "stdio",
                "transport": "stdio",
                "start_command": "./bin/stdio"
              }
            ]